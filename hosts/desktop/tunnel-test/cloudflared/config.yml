# Locally managed tunnel: this file is the config, not the Cloudflare dashboard.
# `tunnel` and `credentials-file` are filled in by ../setup-tunnel.sh, which
# writes the tunnel UUID here and drops the credentials JSON next to it.
tunnel: TUNNEL_ID_PLACEHOLDER
credentials-file: /etc/cloudflared/credentials.json

no-autoupdate: true
# /ready on this port is the internal half of the two-probe scheme in
# decisions/0007: external loop down + /ready up means DNS or ingress, both
# down means the tunnel itself dropped.
metrics: 0.0.0.0:2000

ingress:
  - hostname: test.bythewood.me
    service: http://caddy:80
  - service: http_status:404
