#
# projects.conf
#
# Every project that runs on the server. One line per service.
# Used by quickstart.sh and bootstrap.sh to provision and deploy.
#
# Each container listens on 8000 internally and is reverse-proxied by Caddy
# over the shared bythewood-edge Docker network, so there's no per-project
# port assignment here.
#
# Format: name|github_repo|branch|has_data|has_migrate
#

analytics|overshard/analytics|master|yes|no
blog.bythewood.me|overshard/blog.bythewood.me|master|no|no
timelite|overshard/timelite|master|no|no
isaacbythewood.com|overshard/isaacbythewood.com|master|no|no
status|overshard/status|master|yes|no
darkfurrow.com|overshard/darkfurrow.com|master|no|no
repos|overshard/repos-rust|master|no|no
finance|overshard/finance-rust|master|yes|no
