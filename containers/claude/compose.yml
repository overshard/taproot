# The VPS's Claude Code, driven from claude.ai or the app over remote control.
# From a clone of this repo:
#
#     sudo docker compose -f containers/claude/compose.yml up -d --build
#
# Log in once with: sudo docker exec -it claude claude, then /login.
name: claude
services:
  claude:
    build:
      context: ../..
      dockerfile: containers/claude/Dockerfile
    image: overshard/claude:latest
    container_name: claude
    hostname: vps
    init: true
    # A cap so a runaway build, test or Chromium kills a job in here and not the
    # whole VPS, which runs every site as well.
    mem_limit: 2g
    pids_limit: 2048
    restart: unless-stopped
    working_dir: /home/dev/code
    volumes:
      - claude-code:/home/dev/code
      - claude-home:/home/dev/.claude
      - claude-ssh:/home/dev/.ssh
      - claude-restic:/home/dev/.restic
      - orchard-backup:/home/dev/orchard-backup
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  claude-code:
  claude-home:
  claude-ssh:
  claude-restic:
  # orchard-dump writes to it by this name from a throwaway container.
  orchard-backup:
    name: claude-orchard-backup
