set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g focus-events on
set -g mouse on

# Mouse-select copies straight to the host clipboard over OSC 52, so a drag in
# a pane lands on the Windows clipboard with no Shift-drag. terminal-features
# is what hands tmux the Ms capability it needs. Check it with: tmux info | grep Ms:
set -g set-clipboard on
set -as terminal-features ',xterm-256color:clipboard'

set -g status-position bottom
set -g status-interval 5

set -g status-style "bg=#0e0d0a,fg=#665f56"

set -g status-left-length 30
set -g status-left "#[bg=#6b9e78,fg=#0e0d0a,bold] #S #[bg=#0e0d0a] "

set -g status-right-length 60
set -g status-right "#[fg=#665f56]Pane #(expr #{pane_index} + 1)/#{window_panes} #[fg=#4a443c]| #[fg=#665f56]#(TZ='America/New_York' date +'%%b %%d') #[bg=#c9a84c,fg=#0e0d0a,bold] #(TZ='America/New_York' date +'%%I:%%M %%p') "

set -g window-status-format "#[fg=#665f56] #I:#W "
set -g window-status-current-format "#[bg=#13120e,fg=#ddd7cd,bold] #I:#W "
set -g window-status-separator ""

# The arrow indicators only work with single border lines.
set -g pane-border-style "fg=#332e28"
set -g pane-active-border-style "fg=#6b9e78,bold"
set -g pane-border-lines single
set -g pane-border-indicators both

set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[bg=#6b9e78#,fg=#0e0d0a#,bold] ▸ #{pane_current_command} #[default],#[fg=#4a443c] #{pane_current_command} }"

set -g message-style "bg=#13120e,fg=#ddd7cd"
